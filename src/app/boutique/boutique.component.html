<div class="product-page">

  <div class="boutique-title">
    <h1>BOUTIQUE</h1>
  </div>

  <section class="section-products">
    <div class="container">

      <div class="product-row">
        <div *ngFor="let item of productPeperTree; let i=index">
          <article class="product-card">
            <img
              src={{item.image}}
              alt="Produit PéperTree"
            />
            <h3>{{item.name}}</h3>
            <p class="price">€{{item.price}}</p>
            <!-- <button class="btn btn-buy" type="button">Ajouter au panier</button> -->
            </article>
        </div>
      </div>

    </div>
  </section>

</div>
